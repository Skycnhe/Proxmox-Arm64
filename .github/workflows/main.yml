name: Build and Release Debian 10 ARM64 Template

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (例如: v10.13-1)'
        required: true
        default: '10'

permissions:
  contents: write

jobs:
  build:
    name: Build Debian 10 Rootfs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 安装 debootstrap 以及 ARM64 模拟运行环境 (qemu-user-static)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support xz-utils

      # 真实构建 Debian 10 arm64 文件系统并打包
      - name: Build Debian 10 Rootfs
        run: |
          mkdir -p output
          echo "=== 正在拉取构建 Debian 10 Buster (ARM64) 根文件系统 ==="
          
          # 1. 使用官方归档源构建 arm64 基础系统
          sudo debootstrap --no-check-gpg --arch=arm64 buster ./buster-rootfs https://archive.debian.org/debian/
          
          # 2. 补齐 PVE 网络配置所需的目录与文件，防止创建 CT 时报错
          sudo mkdir -p ./buster-rootfs/etc/network
          sudo touch ./buster-rootfs/etc/network/interfaces

          # 3. 预先配置好归档软件源
          sudo tee ./buster-rootfs/etc/apt/sources.list << 'EOF'
          deb http://archive.debian.org/debian/ buster main contrib non-free
          EOF
          
          # 4. 打包为 PVE 标准规范的 .tar.xz 压缩包
          echo "=== 正在压缩打包模板 ==="
          cd buster-rootfs
          sudo tar -cJf ../output/debian-10-standard_10.13-1_arm64.tar.xz .
          cd ..
          
          # 5. 生成 SHA256 校验码
          cd output
          sha256sum * > sha256sums.txt
          ls -lh
          cd ..

      # 发布到 GitHub Releases
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Debian 10 ARM64 Template Release ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false
          files: |
            output/debian-10-standard_10.13-1_arm64.tar.xz
            output/sha256sums.txt
